<!DOCTYPE html>
<html>
<head>
<title>AquaSmart AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1f3a,#0f2f5c);
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:20px 40px;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

nav a{
margin:0 15px;
color:white;
text-decoration:none;
opacity:0.8;
}

.hero{
text-align:center;
margin-top:80px;
}

.upload{
border:2px dashed rgba(255,255,255,0.3);
padding:40px;
width:350px;
margin:40px auto;
border-radius:15px;
}

button{
background:linear-gradient(90deg,#3aa0ff,#5cc8ff);
border:none;
padding:14px 24px;
border-radius:10px;
color:white;
font-size:16px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
padding:40px;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:15px;
}

</style>

</head>

<body>

<header>

<div class="logo">
🐟 AquaSmart AI
</div>

<nav>
<a href="#">Inicio</a>
<a href="#">Meu aquário</a>
<a href="#">Planejador</a>
<a href="#">Histórico</a>
</nav>

</header>

<div class="hero">

<h1>Envie a foto do peixe</h1>

<p>Descubra espécie, compatibilidade e sugestões</p>

<div class="upload">

<input type="file">

<br><br>

<button>Analisar peixe</button>

</div>

</div>

<div class="cards">

<div class="card">
<h3>Peixe detectado</h3>
<p>Betta splendens</p>
</div>

<div class="card">
<h3>Compatibilidade</h3>
<p>Moderada</p>
</div>

<div class="card">
<h3>Sugestões</h3>
<p>Tetra Neon<br>Rasbora</p>
</div>

</div>

</body>
</html>
