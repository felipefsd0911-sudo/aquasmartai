<!DOCTYPE html>
<html>
<head>
<title>AquaSmart AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family: Arial;
background:#0b1f3a;
color:white;
text-align:center;
padding:40px;
}
h1{
color:#4db8ff;
}
button{
background:#4db8ff;
border:none;
padding:15px 25px;
font-size:18px;
border-radius:10px;
cursor:pointer;
}
.card{
background:#132b4f;
padding:20px;
margin:20px;
border-radius:15px;
}
</style>
</head>

<body>

<h1>🐟 AquaSmart AI</h1>
<p>Planeje seu aquário com inteligência artificial</p>

<div class="card">
<h2>Identificar peixe</h2>
<p>Envie uma foto para descobrir qual peixe é.</p>
<button>Enviar foto</button>
</div>

<div class="card">
<h2>Calculadora de aquário</h2>
<p>Descubra quantos peixes cabem no seu aquário.</p>
<button>Calcular</button>
</div>

<div class="card">
<h2>Planejar aquário</h2>
<p>Veja quais peixes são compatíveis.</p>
<button>Planejar</button>
</div>

</body>
</html>
