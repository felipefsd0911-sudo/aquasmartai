<!DOCTYPE html>
<html>
<head>
<title>AquaSmart AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

body{
font-family: Arial;
background: linear-gradient(180deg,#0b1f3a,#0f2f5c);
color:white;
margin:0;
}

header{
text-align:center;
padding:30px;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#132b4f;
padding:20px;
margin-bottom:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card h2{
margin-top:0;
}

button{
background:#4db8ff;
border:none;
padding:15px;
width:100%;
font-size:16px;
border-radius:12px;
color:white;
}

</style>
</head>

<body>

<header>
🐟 AquaSmart AI
</header>

<div class="container">

<div class="card">
<h2>📷 Identificar peixe</h2>
<p>Envie uma foto para descobrir qual espécie é.</p>
<button>Enviar foto</button>
</div>

<div class="card">
<h2>🧮 Calculadora de aquário</h2>
<p>Descubra quantos peixes cabem no seu aquário.</p>
<button>Calcular</button>
</div>

<div class="card">
<h2>🐠 Compatibilidade</h2>
<p>Veja quais peixes podem viver juntos.</p>
<button>Ver compatibilidade</button>
</div>

</div>

</body>
</html>
