<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaSmart AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#07142a,#0d2b55);
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(0,0,0,0.3);
}

.logo{
font-size:22px;
font-weight:bold;
}

nav a{
color:white;
margin:0 12px;
text-decoration:none;
opacity:0.8;
}

.hero{
text-align:center;
padding:60px 20px;
}

.upload{
margin:30px auto;
border:2px dashed rgba(255,255,255,0.3);
padding:40px;
width:300px;
border-radius:15px;
}

button{
background:linear-gradient(90deg,#3aa0ff,#5cc8ff);
border:none;
padding:14px 25px;
border-radius:10px;
color:white;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
padding:40px;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:15px;
}

footer{
text-align:center;
padding:20px;
opacity:0.6;
}

</style>
</head>

<body>

<header>

<div class="logo">
🐟 AquaSmart AI
</div>

<nav>
<a href="#">Início</a>
<a href="#">Meu Aquário</a>
<a href="#">Planejador</a>
<a href="#">Histórico</a>
</nav>

</header>

<section class="hero">

<h1>Envie a foto do peixe</h1>
<p>Descubra espécie, compatibilidade e sugestões</p>

<div class="upload">

<button>Selecionar imagem</button>
<p>ou arraste a foto aqui</p>

</div>

</section>

<section class="grid">

<div class="card">
<h3>Peixe detectado</h3>
<p>Betta splendens</p>
</div>

<div class="card">
<h3>Compatibilidade</h3>
<p>Moderada</p>
</div>

<div class="card">
<h3>Sugestões</h3>
<p>Tetra Neon<br>Rasbora</p>
</div>

</section>

<footer>
AquaSmart AI
</footer>

</body>
</html>
